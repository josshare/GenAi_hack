name: Deploy AI Agent

on:
  push:
    branches: [ main, developer ]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment (dev|staging|prod)
        required: false
        default: dev
      region:
        description: AWS region
        required: false
        default: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      AWS_REGION: ${{ inputs.region || vars.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps (npm)
        run: npm ci

      - name: Validate config
        run: |
          python3 scripts/validate-config.py config/config.example.yaml --verbose || true

      - name: Deploy infrastructure (CloudFormation)
        run: |
          STACK_NAME="${ENVIRONMENT}-ai-agent"
          # Check if stack is in ROLLBACK_COMPLETE state, and delete it if so
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "STACK_DOES_NOT_EXIST")
          if [ "$STACK_STATUS" == "ROLLBACK_COMPLETE" ]; then
            echo "Stack $STACK_NAME is in ROLLBACK_COMPLETE state. Deleting stack..."
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
            echo "Waiting for stack to be deleted..."
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
            echo "Stack $STACK_NAME deleted."
          fi
          S3_BUCKET_NAME="${STACK_NAME}-deployment-artifacts"
          # Create S3 bucket for artifacts if it doesn't exist
          if ! aws s3api head-bucket --bucket "$S3_BUCKET_NAME" 2>/dev/null; then
            echo "Creating S3 bucket: $S3_BUCKET_NAME"
            aws s3 mb "s3://$S3_BUCKET_NAME" --region "$AWS_REGION"
          else
            echo "S3 bucket $S3_BUCKET_NAME already exists"
          fi
          mkdir -p dist
          # Package and upload incident-processor
          (cd src/functions && zip ../../dist/incident-processor.zip incident_processor.py)
          aws s3 cp dist/incident-processor.zip s3://${S3_BUCKET_NAME}/incident-processor.zip
          # Package and upload action-executor
          (cd src/functions && zip ../../dist/action-executor.zip action_executor.py)
          aws s3 cp dist/action-executor.zip s3://${S3_BUCKET_NAME}/action-executor.zip
          # Package and deploy using the composer template
          aws cloudformation package \
            --template-file infrastructure/composer.yaml \
            --s3-bucket "$S3_BUCKET_NAME" \
            --output-template-file infrastructure/packaged-composer.yaml
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infrastructure/packaged-composer.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment=${ENVIRONMENT} \
              ProjectName=ai-agent \
              CodeS3Bucket=$S3_BUCKET_NAME \
              CodeS3KeyIncident=incident-processor.zip \
              CodeS3KeyAction=action-executor.zip

      - name: Export stack outputs
        run: |
          STACK_NAME="${ENVIRONMENT}-ai-agent"
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' --output json > stack-outputs-raw.json
          python3 -c "import json,sys; d=json.load(open('stack-outputs-raw.json'));\
          m={o['OutputKey']:o['OutputValue'] for o in d};\
          json.dump(m, open('stack-outputs.json','w'));\
          print('Wrote stack-outputs.json with keys:', ', '.join(m.keys()))"
