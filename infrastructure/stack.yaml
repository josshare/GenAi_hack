AWSTemplateFormatVersion: '2010-09-09'
Description: AI Agent infrastructure (CloudFormation) replacing Terraform

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: Environment name (dev, staging, prod)
  ProjectName:
    Type: String
    Default: ai-agent
    Description: Project name
  GitHubRepo:
    Type: String
    Default: "josshare/GenAi_hack"
    Description: "GitHub repository in owner/repo format"
  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch log retention in days

Mappings: {}

Resources:
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: "${Environment}-${ProjectName}-github-actions-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Fn::Sub: "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
              StringLike:
                "token.actions.githubusercontent.com:sub":
                  Fn::Sub: "repo:${GitHubRepo}:*"
      Policies:
        - PolicyName:
            Fn::Sub: "${Environment}-${ProjectName}-github-actions-policy"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - "cloudformation:*"
                  - "s3:*"
                  - "iam:PassRole"
                Resource: "*"
      Tags:
        - Key: Project
          Value:
            Ref: ProjectName
        - Key: Environment
          Value:
            Ref: Environment

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: "${Environment}-${ProjectName}-lambda-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: lambda.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName:
            Fn::Sub: "${Environment}-${ProjectName}-lambda-policy"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Environment}-${ProjectName}-*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - Fn::GetAtt: [IncidentsTable, Arn]
                  - Fn::GetAtt: [ActionsTable, Arn]
                  - Fn::Sub: "${IncidentsTable.Arn}/index/*"
                  - Fn::Sub: "${ActionsTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                Resource: "*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  Fn::Sub: "arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-sonnet-*"
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:RebootInstances
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                  - ecs:DescribeTasks
                  - ecs:StopTask
                Resource: "*"
              - Effect: Allow
                Action:
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:UpdateAutoScalingGroup
                  - autoscaling:SetDesiredCapacity
                Resource: "*"
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource:
                  Fn::Sub: "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Environment}-${ProjectName}-*"
              - Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                  - rds:RebootDBInstance
                Resource: "*"
              - Effect: Allow
                Action:
                  - elasticache:DescribeCacheClusters
                  - elasticache:RebootCacheCluster
                Resource: "*"
              - Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:CreateInvalidation
                Resource: "*"
      Tags:
        - Key: Project
          Value: AI-Agent
        - Key: Environment
          Value:
            Ref: Environment

  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: "${Environment}-${ProjectName}-incidents"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: incident_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: incident_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-timestamp-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: "${Environment}-${ProjectName}-incidents"
        - Key: Project
          Value: AI-Agent
        - Key: Environment
          Value:
            Ref: Environment

  ActionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: "${Environment}-${ProjectName}-actions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: action_id
          AttributeType: S
        - AttributeName: incident_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: action_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: incident-timestamp-index
          KeySchema:
            - AttributeName: incident_id
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: "${Environment}-${ProjectName}-actions"
        - Key: Project
          Value: AI-Agent
        - Key: Environment
          Value:
            Ref: Environment

  IncidentProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${Environment}-${ProjectName}-incident-processor"
      RetentionInDays:
        Ref: LogRetentionDays
      Tags:
        - Key: Project
          Value: AI-Agent
        - Key: Environment
          Value:
            Ref: Environment

  ActionExecutorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${Environment}-${ProjectName}-action-executor"
      RetentionInDays:
        Ref: LogRetentionDays
      Tags:
        - Key: Project
          Value: AI-Agent
        - Key: Environment
          Value:
            Ref: Environment

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: "${Environment}-${ProjectName}-alerts"
      Tags:
        - Key: Project
          Value: AI-Agent
        - Key: Environment
          Value:
            Ref: Environment

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: "${Environment}-${ProjectName}-lambda-errors"
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 2
      MetricName: Errors
      Namespace: AWS/Lambda
      Period: 300
      Statistic: Sum
      Threshold: 5
      AlarmDescription: This alarm monitors lambda errors
      Dimensions:
        - Name: FunctionName
          Value:
            Fn::Sub: "${Environment}-${ProjectName}-incident-processor"
      AlarmActions:
        - Fn::GetAtt: [AlertsTopic, TopicArn]

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: "${Environment}-${ProjectName}-lambda-duration"
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 3
      MetricName: Duration
      Namespace: AWS/Lambda
      Period: 300
      Statistic: Average
      Threshold: 240000
      AlarmDescription: This alarm monitors lambda duration
      Dimensions:
        - Name: FunctionName
          Value:
            Fn::Sub: "${Environment}-${ProjectName}-incident-processor"
      AlarmActions:
        - Fn::GetAtt: [AlertsTopic, TopicArn]

  DynamoDBThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: "${Environment}-${ProjectName}-dynamodb-throttles"
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 2
      MetricName: ReadThrottledEvents
      Namespace: AWS/DynamoDB
      Period: 300
      Statistic: Sum
      Threshold: 0
      AlarmDescription: This alarm monitors DynamoDB throttling
      Dimensions:
        - Name: TableName
          Value:
            Ref: IncidentsTable
      AlarmActions:
        - Fn::GetAtt: [AlertsTopic, TopicArn]

  KmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for AI Agent encryption
      Enabled: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:aws:iam::${AWS::AccountId}:root
            Action: 'kms:*'
            Resource: '*'
      Tags:
        - Key: Name
          Value:
            Fn::Sub: "${Environment}-${ProjectName}-kms-key"
        - Key: Project
          Value: AI-Agent
        - Key: Environment
          Value:
            Ref: Environment

  KmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName:
        Fn::Sub: "alias/${Environment}-${ProjectName}-key"
      TargetKeyId:
        Ref: KmsKey

  DeploymentArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID:
                Fn::GetAtt: [KmsKey, Arn]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: "${Environment}-${ProjectName}-deployment-artifacts"
        - Key: Project
          Value: AI-Agent
        - Key: Environment
          Value:
            Ref: Environment

  CloudWatchAlarmsRule:
    Type: AWS::Events::Rule
    Properties:
      Name:
        Fn::Sub: "${Environment}-${ProjectName}-cloudwatch-alarms"
      Description: Capture CloudWatch alarm state changes
      EventPattern:
        source:
          - aws.cloudwatch
        detail-type:
          - CloudWatch Alarm State Change
        detail:
          state:
            value:
              - ALARM
      State: ENABLED

Outputs:
  GitHubActionsRoleArn:
    Description: ARN of the GitHub Actions deployment role
    Value:
      Fn::GetAtt: [GitHubActionsRole, Arn]
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}:GitHubActionsRoleArn"

  LambdaExecutionRoleArn:
    Description: ARN of the Lambda execution role
    Value:
      Fn::GetAtt: [LambdaExecutionRole, Arn]
    Export:
      Name:
        Fn::Sub: "${AWS::StackName}:LambdaExecutionRoleArn"
  IncidentsTableName:
    Description: Name of the incidents DynamoDB table
    Value:
      Ref: IncidentsTable
  ActionsTableName:
    Description: Name of the actions DynamoDB table
    Value:
      Ref: ActionsTable
  SnsAlertsTopicArn:
    Description: ARN of the SNS alerts topic
    Value:
      Fn::GetAtt: [AlertsTopic, TopicArn]
  KmsKeyId:
    Description: ID of the KMS key
    Value:
      Ref: KmsKey
  DeploymentArtifactsBucket:
    Description: Name of the deployment artifacts S3 bucket
    Value:
      Ref: DeploymentArtifactsBucket
  LambdaErrorsAlarmName:
    Description: CloudWatch alarm name for Lambda errors
    Value:
      Ref: LambdaErrorAlarm
  LambdaDurationAlarmName:
    Description: CloudWatch alarm name for Lambda duration
    Value:
      Ref: LambdaDurationAlarm
  DynamoDBThrottleAlarmName:
    Description: CloudWatch alarm name for DynamoDB throttles
    Value:
      Ref: DynamoDBThrottleAlarm
